function noiseTile(size,cells,oct){
 const [c,x]=cnv(size);const img=x.createImageData(size,size),d=img.data;const lat=[];
 for(let o=0;o<oct;o++){const n=cells<<o,a=new Float32Array(n*n);for(let i=0;i<n*n;i++)a[i]=Math.random();lat.push({n,a});}
 function sm(l,fx,fy){const n=l.n,gx=fx*n,gy=fy*n,ix=Math.floor(gx),iy=Math.floor(gy);
  let sx=gx-ix,sy=gy-iy;sx=sx*sx*(3-2*sx);sy=sy*sy*(3-2*sy);
  const i00=l.a[(iy%n)*n+(ix%n)],i10=l.a[(iy%n)*n+((ix+1)%n)],i01=l.a[((iy+1)%n)*n+(ix%n)],i11=l.a[((iy+1)%n)*n+((ix+1)%n)];
  return (i00*(1-sx)+i10*sx)*(1-sy)+(i01*(1-sx)+i11*sx)*sy;}
 let k=0;
 for(let y=0;y<size;y++)for(let xx=0;xx<size;xx++){let v=0,amp=1,tot=0;
  for(let o=0;o<oct;o++){v+=sm(lat[o],xx/size,y/size)*amp;tot+=amp;amp*=0.5;}
  const b=(v/tot*255)|0;d[k++]=b;d[k++]=b;d[k++]=b;d[k++]=255;}
 x.putImageData(img,0,0);return c;
}
function weaveTile(size,cells){
 const [c,x]=cnv(size);const s=size/cells;
 x.fillStyle='#7d7d7d';x.fillRect(0,0,size,size);
 for(let i=0;i<cells;i++)for(let j=0;j<cells;j++){
  const sh=120+((Math.random()*34)|0)-17;x.fillStyle=`rgb(${sh},${sh},${sh})`;
  if((i+j)%2===0)x.fillRect(j*s+1,i*s+1,s-2,s-2);}
 x.strokeStyle='rgba(0,0,0,.4)';x.lineWidth=1;
 for(let i=0;i<=cells;i++){x.beginPath();x.moveTo(i*s,0);x.lineTo(i*s,size);x.stroke();
  x.beginPath();x.moveTo(0,i*s);x.lineTo(size,i*s);x.stroke();}
 return c;
}

 add(J.hipR,new THREE.BoxGeometry(0.05,0.1,0.035),MATS.leather,0.06,-0.16,0.065,0,0,0.1);

/* ============================ VERLET CHAINS ============================ */
class Chain{
 constructor(n,seg){this.n=n;this.seg=seg;this.init=false;
  this.p=[];this.q=[];
  for(let i=0;i<n;i++){this.p.push(new THREE.Vector3());this.q.push(new THREE.Vector3());}}
 step(anchor,dir,wind,dt,time){
  if(!this.init){for(let i=0;i<this.n;i++){
   this.p[i].copy(anchor).addScaledVector(dir,this.seg*i);this.q[i].copy(this.p[i]);}
   this.init=true;return;}
  const d2=dt*dt;
  for(let i=2;i<this.n;i++){
   const p=this.p[i],q=this.q[i];
   const fl=1+0.35*Math.sin(time*5.2+i*0.9);
   const vx=(p.x-q.x)*0.965,vy=(p.y-q.y)*0.965,vz=(p.z-q.z)*0.965;
   q.copy(p);
   p.x+=vx+wind.x*fl*d2;p.y+=vy-3.2*d2+wind.y*d2;p.z+=vz+wind.z*d2;
  }
  this.p[0].copy(anchor);this.q[0].copy(anchor);
  this.p[1].copy(anchor).addScaledVector(dir,this.seg);this.q[1].copy(this.p[1]);
  for(let k=0;k<3;k++){
   for(let i=0;i<this.n-1;i++){
    const a=this.p[i],b=this.p[i+1];
    const dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z;
    const dist=Math.sqrt(dx*dx+dy*dy+dz*dz)||1e-6;
    const diff=(dist-this.seg)/dist;
    if(i<2){b.x-=dx*diff;b.y-=dy*diff;b.z-=dz*diff;}
    else{const h=diff*0.5;
     a.x+=dx*h;a.y+=dy*h;a.z+=dz*h;b.x-=dx*h;b.y-=dy*h;b.z-=dz*h;}
   }
  }
 }
}
function ribbonMesh(n,w0,w1,mat){
 const g=new THREE.BufferGeometry();
 const pos=new Float32Array(n*6),uv=new Float32Array(n*4);
 for(let i=0;i<n;i++){const u=i/(n-1);
  uv[i*4]=u;uv[i*4+1]=0;uv[i*4+2]=u;uv[i*4+3]=1;}
 g.setAttribute('position',new THREE.BufferAttribute(pos,3));
 g.setAttribute('uv',new THREE.BufferAttribute(uv,2));
 const idx=[];
 for(let i=0;i<n-1;i++){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}
 g.setIndex(idx);
 const mesh=new THREE.Mesh(g,mat);
 mesh.frustumCulled=false;mesh.castShadow=true;mesh.receiveShadow=true;
 mesh.userData.write=pts=>{
  for(let i=0;i<n;i++){
   const p=pts[i],pn=pts[Math.min(i+1,n-1)],pp=pts[Math.max(i-1,0)];
   const dx=pn.x-pp.x,dy=pn.y-pp.y,dz=pn.z-pp.z;
   let sx=dy,sy=-dx;const sl=Math.hypot(sx,sy)||1;sx/=sl;sy/=sl;
   const w=w0+(w1-w0)*(i/(n-1));
   pos[i*6]=p.x-sx*w*0.5;pos[i*6+1]=p.y-sy*w*0.5;pos[i*6+2]=p.z;
   pos[i*6+3]=p.x+sx*w*0.5;pos[i*6+4]=p.y+sy*w*0.5;pos[i*6+5]=p.z;
  }
  g.attributes.position.needsUpdate=true;
 };
 return mesh;
}
function chainsUpdate(dt){
 scarfAnchor.getWorldPosition(A0);
 D0.set(0,-0.22,-1).normalize();
 const gust=0.7+0.5*Math.sin(t*0.33+1.2)+poseE*0.5+(strikeT>=0?0.8:0);
 W.set(Math.sin(t*0.6)*0.5*gust,0.12*gust,-0.55*gust);
 chainScarf.step(A0,D0,W,dt,t);ribbonScarf.userData.write(chainScarf.p);
 knotAnchor.getWorldPosition(A1);
 D1.set(-0.06,-0.35,-1).normalize();D2.set(0.06,-0.35,-1).normalize();
 const g2=gust*0.6;
 W2.set(Math.sin(t*0.6+1)*0.3*g2,0.05*g2,-0.45*g2);
 chainT1.step(A1,D1,W2,dt,t);ribbonT1.userData.write(chainT1.p);
 chainT2.step(A1,D2,W2,dt,t);ribbonT2.userData.write(chainT2.p);
}

/* ============================ SWORD TRAIL ============================ */
const TRN=18;let trailPts=[],trailFade=0,trailGeo,trailMesh;
function buildTrail(){
 trailGeo=new THREE.BufferGeometry();
 trailGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(TRN*6),3));
 trailGeo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(TRN*8),4));
 const idx=[];
 for(let i=0;i<TRN-1;i++){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}
 trailGeo.setIndex(idx);
 trailMesh=new THREE.Mesh(trailGeo,new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,
  blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
 trailMesh.frustumCulled=false;trailMesh.visible=false;
 scene.add(trailMesh);
}
function trailUpdate(dt){
 if(trailRec){
  VA.set(0.30,0,0).applyMatrix4(katana.matrixWorld);
  VB.set(0.80,0,0).applyMatrix4(katana.matrixWorld);
  trailPts.push([VA.clone(),VB.clone()]);
  if(trailPts.length>TRN)trailPts.shift();
  trailFade=1;
 }else if(trailFade>0){
  trailFade-=dt*2.2;
  if(trailFade<=0)trailPts.length=0;
 }
 const n=trailPts.length;
 trailMesh.visible=n>2&&trailFade>0;
 if(trailMesh.visible){
  const pa=trailGeo.attributes.position,ca=trailGeo.attributes.color;
  for(let i=0;i<TRN;i++){
   const pt=trailPts[Math.min(i,n-1)];
   const al=Math.pow((i+1)/n,1.3)*trailFade*(i===n-1?0.35:1);
   pa.setXYZ(i*2,pt[0].x,pt[0].y,pt[0].z);
   pa.setXYZ(i*2+1,pt[1].x,pt[1].y,pt[1].z);
   ca.setXYZW(i*2,0.25,0.6,0.9,al);
   ca.setXYZW(i*2+1,0.55,0.95,1.0,Math.min(1,al*1.25));
  }
  pa.needsUpdate=true;ca.needsUpdate=true;
 }
}

/* ============================ SOUND (tiny synth) ============================ */
let AC=null;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
 if(AC.state==='suspended')AC.resume();return AC;}
function sfxShing(){try{const a=ac(),tt=a.currentTime;
 [5200,6600,4100].forEach((f,i)=>{const o=a.createOscillator();o.type='sine';
  o.frequency.value=f*(1+Math.random()*0.01);
  const g=a.createGain();g.gain.setValueAtTime(0.10/(i+1),tt);
  g.gain.exponentialRampToValueAtTime(0.0001,tt+0.5);
  o.connect(g);g.connect(a.destination);o.start(tt);o.stop(tt+0.55);});}catch(e){}}
function sfxWhoosh(){try{const a=ac(),tt=a.currentTime,dur=0.28;
 const b=a.createBuffer(1,Math.floor(a.sampleRate*dur),a.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<d.length;i++){const k=i/d.length;
  d[i]=(Math.random()*2-1)*Math.sin(k*Math.PI)*Math.pow(1-k,1.5);}
 const s=a.createBufferSource();s.buffer=b;
 const f=a.createBiquadFilter();f.type='bandpass';f.Q.value=1.2;
 f.frequency.setValueAtTime(350,tt);f.frequency.exponentialRampToValueAtTime(2200,tt+dur*0.4);
 const g=a.createGain();g.gain.value=0.45;
 s.connect(f);f.connect(g);g.connect(a.destination);s.start(tt);}catch(e){}}
function sfxSheath(){try{const a=ac(),tt=a.currentTime;
 const b=a.createBuffer(1,2205,44100),d=b.getChannelData(0);
 for(let i=0;i<2205;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/2205,2)*0.4;
 const s=a.createBufferSource();s.buffer=b;
 const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=1800;
 const g=a.createGain();g.gain.value=0.3;
 s.connect(f);f.connect(g);g.connect(a.destination);s.start(tt);}catch(e){}}

/* ============================ ACTIONS ============================ */
function sampleStrike(tt){
 const K=STRIKE_KEYS;
 if(tt<=K[0].t)return K[0].p;
 for(let i=0;i<K.length-1;i++){
  if(tt<=K[i+1].t){
   let u=(tt-K[i].t)/(K[i+1].t-K[i].t);
   u=K[i].ease(u);
   const o={};
   for(const ch of STRIKE_CH){const a=K[i].p[ch],b=K[i+1].p[ch];
    o[ch]=[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u];}
   return o;
  }
 }
 return K[K.length-1].p;
}
function doStrike(){
 if(strikeT>=0)return;
 strikePrev=stance;
 if(stance!=='combat'){stance='combat';poseTarget=1;refreshUI();}
 if(swordOnBack)attachPending=true;
 strikeT=0;whooshed=false;
}
function toggleStance(){
 if(strikeT>=0)return;
 if(stance==='idle'){stance='combat';poseTarget=1;swordTo('hand');sfxShing();}
 else{stance='idle';poseTarget=0;swordTo('back');sfxSheath();}
 refreshUI();
}
function refreshUI(){
 const b=$('bStance');
 b.textContent=stance==='combat'?'COMBAT':'IDLE';
 b.classList.toggle('on',stance==='combat');
}

/* ============================ ANIMATION ============================ */
function animate(dt){
 poseE+=(poseTarget-poseE)*Math.min(1,dt*6);
 // blink
 nextBlink-=dt;
 if(nextBlink<0&&blinkT<0){blinkT=0;nextBlink=2+Math.random()*4;}
 if(blinkT>=0){blinkT+=dt;
  const p=blinkT/0.16;
  blinkE=Math.sin(Math.min(p,1)*Math.PI);
  if(p>1){blinkT=-1;blinkE=0;}}
 // gaze smoothing
 cy+=(tyaw-cy)*Math.min(1,dt*7);
 cp+=(tpit-cp)*Math.min(1,dt*7);
 // base pose blend
 for(const k of JN){const a=POSES.idle[k],b=POSES.combat[k];
  J[k].rotation.set(a[0]+(b[0]-a[0])*poseE,a[1]+(b[1]-a[1])*poseE,a[2]+(b[2]-a[2])*poseE);}
 hips.position.y=0.97-0.045*poseE+Math.sin(t*1.6)*0.0045+Math.sin(t*3.1)*0.004*poseE;
 const wI=1-poseE;
 J.elL.rotation.x+=Math.sin(t*1.5+1)*0.035*wI;
 J.elR.rotation.x+=Math.sin(t*1.5)*0.035*wI;
 J.shL.rotation.x+=Math.sin(t*0.7)*0.02*wI;
 J.shR.rotation.x+=Math.sin(t*0.7+2)*0.02*wI;
 const br=Math.sin(t*1.6)*0.018;
 chestMesh.scale.set(chestBase.x*(1+br),chestBase.y*(1+br*0.7),chestBase.z*(1+br*0.5));
 // strike
 let sAmt=0,lung=0;
 if(strikeT>=0){
  strikeT+=dt;sAmt=1;
  const S=sampleStrike(strikeT);
  for(const k of STRIKE_CH){const r=S[k];J[k].rotation.set(r[0],r[1],r[2]);}
  lung=strikeT<0.58?0.13*Math.sin(strikeT/0.58*Math.PI):0;
  if(attachPending&&strikeT>=0.08){swordTo('hand');sfxShing();attachPending=false;shake=Math.max(shake,0.35);}
  if(!whooshed&&strikeT>=0.24){whooshed=true;sfxWhoosh();shake=Math.max(shake,0.85);}
  trailRec=strikeT>=0.08&&strikeT<=0.46;
  if(strikeT>=1.05){
   if(strikePrev==='idle'){stance='idle';poseTarget=0;swordTo('back');sfxSheath();refreshUI();}
   strikeT=-1;whooshed=false;trailRec=false;
  }
 }
 ninja.position.z=lung;
 // head tracking
 const tw=1-0.75*sAmt;
 J.head.rotation.y+=cy*0.75*tw;
 J.head.rotation.x+=cp*tw;
 eyeGL.rotation.set(cp*0.5*tw,cy*0.55*tw,0);
 eyeGR.rotation.set(cp*0.5*tw,cy*0.55*tw,0);
 lidUL.rotation.x=-0.35+blinkE*0.75;
 lidUR.rotation.x=-0.35+blinkE*0.75;
}
function updPoints(p,dt){
 const {pos,dat,n}=p.userData;
 for(let i=0;i<n;i++){const d=dat[i];
  d.y+=d.vy*dt;d.a+=d.s*dt;
  if(d.y>5)d.y=0.1;
  pos[i*3]=Math.cos(d.a)*d.r+Math.sin(t*0.4+d.ph)*0.15;
  pos[i*3+1]=d.y+Math.sin(t*0.8+d.ph)*0.08;
  pos[i*3+2]=Math.sin(d.a)*d.r+Math.cos(t*0.35+d.ph)*0.15;}
 p.geometry.attributes.position.needsUpdate=true;
}

/* ============================ LOOP ============================ */
function loop(){
 requestAnimationFrame(loop);
 const dt=Math.min(clock.getDelta(),0.05);
 t+=dt;
 animate(dt);
 ninja.updateMatrixWorld(true);
 chainsUpdate(dt);
 trailUpdate(dt);
 updPoints(embers,dt);
 updPoints(motes,dt);
 for(const r of rocks){const u=r.userData;
  r.position.y=u.y+Math.sin(t*0.5+u.ph)*0.14;
  r.rotation.y+=u.rs*dt;r.rotation.x+=u.rs*0.6*dt;}
 stars.material.opacity=0.7+0.2*Math.sin(t*1.3);
 embers.material.opacity=0.6+0.25*Math.sin(t*2.2);
 if(introT<1){
  introT+=dt/2.4;
  const e=eIO(Math.min(introT,1));
  camera.position.lerpVectors(CAM_A,CAM_B,e);
  camera.lookAt(0,1.02,0);
  if(introT>=1)controls.enabled=true;
 }else{
  if(shake>0.005){
   controls.target.set((Math.random()-0.5)*shake*0.02,
    1.02+(Math.random()-0.5)*shake*0.02,
    (Math.random()-0.5)*shake*0.02);
  }else controls.target.set(0,1.02,0);
  controls.autoRotate=autoRot;
  controls.update();
  controls.target.set(0,1.02,0);
  shake*=Math.exp(-dt*7);
 }
 renderer.info.reset();
 composer.render();
 frames++;
 if(t-fpsT>0.5){
  const fps=frames/(t-fpsT);frames=0;fpsT=t;
  $('stats').innerHTML=`${fps.toFixed(0)} FPS &nbsp;·&nbsp; ${Math.round(renderer.info.render.triangles/1000)}K TRIS<br>CLOTH ${CLOTH_RES}&sup2; &nbsp;·&nbsp; GPU MAX ${renderer.capabilities.maxTextureSize}&sup2;`;
 }
}

/* ============================ BOOT ============================ */
async function boot(){
 const fill=$('fill'),status=$('status');
 // renderer first (needed for capabilities)
 renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.12;
 renderer.info.autoReset=false;
 maxAniso=Math.min(8,renderer.capabilities.getMaxAnisotropy());
 const coarse=matchMedia('(pointer: coarse)').matches;
 HERO_RES=Math.min(coarse?4096:8192,renderer.capabilities.maxTextureSize);
 // fonts for canvas engraving
 try{await Promise.all([
  document.fonts.load('900 100px Cinzel'),
  document.fonts.load('900 100px "Noto Serif JP"'),
  document.fonts.load('600 100px Rajdhani')]);}catch(e){}
 const step=async(label,pct,fn)=>{
  status.textContent=label;fill.style.width=pct+'%';await raf2();
  fn();await raf2();};
 await step('WEAVING 8K CLOTH',25,buildTextures);
 await step('SUMMONING MOONLIGHT',55,initWorld);
 await step('FORGING FAHAD',80,buildNinja);
 await step('BINDING SHADOWS',100,()=>{bindEvents();});
 fill.style.width='100%';
 $('loader').classList.add('done');
 $('title').classList.add('show');
 setTimeout(()=>$('loader').remove(),1600);
 refreshUI();
 loop();
}
function bindEvents(){
 addEventListener('resize',()=>{
  const w=innerWidth,h=innerHeight;
  camera.aspect=w/h;camera.updateProjectionMatrix();
  const pr=Math.min(devicePixelRatio,2);
  renderer.setPixelRatio(pr);renderer.setSize(w,h);
  composer.setPixelRatio(pr);composer.setSize(w,h);
 });
 addEventListener('pointermove',e=>{
  tx=(e.clientX/innerWidth)*2-1;
  ty=-(e.clientY/innerHeight)*2+1;
  tyaw=clamp(tx*0.6,-0.55,0.55);
  tpit=clamp(-ty*0.38,-0.42,0.35);
 });
 let pd=null;
 renderer.domElement.addEventListener('pointerdown',e=>{
  pd={x:e.clientX,y:e.clientY,t:performance.now()};});
 renderer.domElement.addEventListener('pointerup',e=>{
  if(!pd)return;
  const dx=e.clientX-pd.x,dy=e.clientY-pd.y;
  if(dx*dx+dy*dy<64&&performance.now()-pd.t<400){
   pv.set(tx,ty);rc.setFromCamera(pv,camera);
   if(rc.intersectObject(ninja,true).length)doStrike();
  }
  pd=null;});
 $('bStrike').addEventListener('click',doStrike);
 $('bStance').addEventListener('click',toggleStance);
 $('bRotate').addEventListener('click',()=>{
  autoRot=!autoRot;$('bRotate').classList.toggle('on',autoRot);});
 addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();doStrike();}
  else if(e.code==='KeyS')toggleStance();
  else if(e.code==='KeyR'){autoRot=!autoRot;$('bRotate').classList.toggle('on',autoRot);}
 });
 $('hint').innerHTML=matchMedia('(pointer: coarse)').matches
  ?'DRAG · ORBIT&nbsp;&nbsp;PINCH · ZOOM&nbsp;&nbsp;TAP FAHAD · STRIKE'
  :'DRAG · ORBIT&nbsp;&nbsp;WHEEL · ZOOM&nbsp;&nbsp;CLICK FAHAD · STRIKE';
}
boot().catch(err=>{
 const el=$('err');
 el.style.display='flex';
 el.textContent='THIS SHADOW NEEDS WEBGL — '+err.message;
 console.error(err);
});
